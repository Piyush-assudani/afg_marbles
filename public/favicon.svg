<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" fill="none" width="100%" height="100%">
  <defs>
    <!-- Metallic Bronze/Gold Gradients -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb78c" />
      <stop offset="35%" stop-color="#c99765" />
      <stop offset="70%" stop-color="#e8cca7" />
      <stop offset="100%" stop-color="#9d6c3b" />
    </linearGradient>
    <linearGradient id="redGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#ba1224" />
    </linearGradient>
    <linearGradient id="redGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba1224" />
      <stop offset="100%" stop-color="#7a0d18" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= LOGO ICON: RED 'A' TRIANGLE ================= -->
  <!-- Upper Triangle portion -->
  <path d="M 88 24 L 132 122 C 102 126 62 138 34 172 C 38 135 62 70 88 24 Z" 
        fill="url(#redGradTop)" />

  <!-- Lower Curved Swoosh portion -->
  <path d="M 12 208 C 45 168 115 152 165 158 C 172 178 168 198 160 210 C 115 200 50 202 12 208 Z" 
        fill="url(#redGradBottom)" />

  <!-- ================= LETTERS: . F . G ================= -->
  <!-- First Dot -->
  <circle cx="186" cy="186" r="9" fill="url(#bronzeGrad)" />

  <!-- Letter F -->
  <path d="M 212 36 L 278 36 L 278 54 L 234 54 L 234 102 L 270 102 L 270 120 L 234 120 L 234 204 L 212 204 Z" 
        fill="url(#bronzeGrad)" />

  <!-- Second Dot -->
  <circle cx="295" cy="186" r="9" fill="url(#bronzeGrad)" />

  <!-- Letter G -->
  <path d="M 390 32 C 342 32 316 68 316 120 C 316 172 344 208 394 208 C 434 208 456 186 460 148 L 396 148 L 396 130 L 482 130 C 484 175 455 226 394 226 C 330 226 292 180 292 120 C 292 60 334 14 394 14 C 438 14 466 36 476 66 L 454 74 C 445 52 424 32 390 32 Z" 
        fill="url(#bronzeGrad)" />

  <!-- ================= SUBTEXT: — MARBLE & ARTS — ================= -->
  <!-- Left Rule Line -->
  <line x1="24" y1="254" x2="110" y2="254" stroke="url(#bronzeGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="260" y="260" 
        text-anchor="middle" 
        fill="url(#bronzeGrad)" 
        font-family="'Manrope', 'Cinzel', 'Trajan Pro', serif" 
        font-size="16.5" 
        font-weight="600" 
        letter-spacing="7">MARBLE &amp; ARTS</text>

  <!-- Right Rule Line -->
  <line x1="410" y1="254" x2="496" y2="254" stroke="url(#bronzeGrad)" stroke-width="1.8" stroke-linecap="round" />
</svg>
